name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cmms
          POSTGRES_PASSWORD: cmms
          POSTGRES_DB: cmms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cmms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cmms:cmms@localhost:5432/cmms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint y formato
        run: |
          ruff check .
          ruff format --check .
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (PostgreSQL)
        run: pytest
      - name: Chequeos de despliegue
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-not-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFG
          DJANGO_ALLOWED_HOSTS: cmms.example.com
        run: python manage.py check --deploy --fail-level WARNING
