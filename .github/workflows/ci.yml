name: CI

# Minutos de Actions (repo privado): cada push corre una vez (sin pull_request duplicado),
# los cambios solo de documentación no corren, un push nuevo cancela la corrida anterior
# de la misma rama y las ramas prueban solo la versión de producción (Render: 3.13);
# main prueba además 3.11.
on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "Marca/**"
  # Solo a mano (pestaña Actions → CI → Run workflow): el e2e de la PWA de terreno con
  # Playwright. No corre en cada push porque los minutos de Actions son escasos.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ github.ref == 'refs/heads/main' && fromJSON('["3.11", "3.13"]') || fromJSON('["3.13"]') }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cmms
          POSTGRES_PASSWORD: cmms
          POSTGRES_DB: cmms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cmms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Rol de la aplicación sin SUPERUSER ni BYPASSRLS, como en producción: un
      # superusuario ignora Row-Level Security y los tests de RLS no probarían nada (ADR-026).
      DATABASE_URL: postgres://cmms_app:cmms_app@localhost:5432/cmms
    steps:
      - uses: actions/checkout@v4
      - name: Rol de aplicación sujeto a RLS
        env:
          PGPASSWORD: cmms
        run: |
          psql -h localhost -U cmms -d cmms -v ON_ERROR_STOP=1             -c "CREATE ROLE cmms_app LOGIN PASSWORD 'cmms_app' CREATEDB NOSUPERUSER NOBYPASSRLS"             -c "ALTER DATABASE cmms OWNER TO cmms_app"             -c "GRANT ALL ON SCHEMA public TO cmms_app"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Dependencias (lock al día)
        run: uv sync --locked
      - name: GNU gettext (catálogo de traducciones al día, X-07)
        run: sudo apt-get install -y --no-install-recommends gettext
      - name: Lint y formato
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: requirements*.txt al día con uv.lock
        run: |
          uv export --no-dev --no-hashes --no-emit-project -o requirements.txt
          uv export --no-hashes --no-emit-project -o requirements-dev.txt
          git diff --exit-code -- requirements.txt requirements-dev.txt
      - name: Migraciones al día
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests (PostgreSQL)
        env:
          REQUIRE_GETTEXT: "1"
        run: uv run pytest
      - name: Chequeos de despliegue
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-not-secret-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFG
          DJANGO_ALLOWED_HOSTS: cmms.example.com
        run: uv run python manage.py check --deploy --fail-level WARNING

  # E2E de la PWA de terreno (X-06, ADR-011): servidor con seed_demo + Playwright chromium.
  # Solo con workflow_dispatch; cómo correrlo en local: docs/07_operacion.md.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cmms
          POSTGRES_PASSWORD: cmms
          POSTGRES_DB: cmms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cmms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cmms:cmms@localhost:5432/cmms
      E2E_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Dependencias
        run: uv sync --locked
      - name: Base de demostración
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_demo --reset
      - name: Servidor
        run: |
          nohup uv run python manage.py runserver 127.0.0.1:8765 --noreload > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8765/healthz && break; sleep 1; done
      - name: Playwright chromium
        run: uv run --no-project --with playwright playwright install --with-deps chromium
      - name: E2E
        run: |
          mkdir -p e2e-shots
          E2E_SHOTS=e2e-shots uv run --no-project --with playwright --with pytest pytest -c tests/e2e/pytest.ini tests/e2e
      - name: Capturas y registro del servidor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            e2e-shots/
            server.log
          retention-days: 7
