[project]
name = "galbust-cmms"
version = "0.1.0"
description = "GALBUST CMMS — CMMS SaaS multi-empresa para pymes productivas"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    "whitenoise>=6.7",
    "segno>=1.6",
    "uuid-utils>=0.9",
    "django-allauth[mfa]>=65",
    "argon2-cffi>=23",
    "openpyxl>=3.1",
    "pillow>=12.3.0",
    "reportlab>=5.0",
    "procrastinate>=3.10.0",
    "django-storages[s3]>=1.14.6",
    "sentry-sdk>=2.70.0",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "drf-spectacular-sidecar>=2026.9.1",
    "pypdf>=6.19.0",
    "anthropic>=1.15.0",
    "pyjwt>=2.10",
    "cryptography>=44",
    "dnspython>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.6",
    "pre-commit>=4",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
# whitenoise avisa que STATIC_ROOT no existe: en tests no se corre collectstatic.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"apps/ui/templatetags/ui.py" = ["E501"]  # trazados SVG de íconos
