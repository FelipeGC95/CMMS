{% load static i18n ui accounts_tags %}<!doctype html>
{% get_current_language as LANGUAGE_CODE %}<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B2E4F">
  {# htmx no inyecta su <style> de indicadores: la CSP no admite estilos en línea. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block title %}{% endblock %} · GALBUST CMMS</title>
  <link rel="icon" href="{% static 'brand/galbust-favicon.ico' %}">
  <link rel="apple-touch-icon" href="{% static 'brand/galbust-app-icon-180.png' %}">
  <link rel="preload" href="{% static 'fonts/poppins-latin-500-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <script src="{% static 'js/theme.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  {% if organization.primary_color %}<link rel="stylesheet" href="{% url 'organization_theme_css' %}?v={{ organization.primary_color|slice:'1:'|lower }}">{% endif %}
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'{% if membership %} data-user-id="{{ user.pk }}" data-organization-id="{{ organization.pk }}"{% endif %}>
  <a class="skip-link" href="#main">{% translate "Saltar al contenido" %}</a>
  {% if user.is_authenticated %}
  <header class="navbar">
    <div class="navbar__inner">
      <a class="brand" href="{% url 'dashboard' %}" aria-label="{% translate 'GALBUST CMMS, inicio' %}">
        <img class="brand__logo--full" src="{% static 'brand/galbust-horizontal-negativo.svg' %}" alt="GALBUST" width="118" height="28">
        <img class="brand__logo--iso" src="{% static 'brand/galbust-isotipo-blanco.svg' %}" alt="GALBUST" width="28" height="28">
        <span class="brand__product">CMMS</span>
      </a>
      <nav class="navbar__links" aria-label="{% translate 'Principal' %}">
        <a href="{% url 'dashboard' %}" {% nav_current '/' %}>{% translate "Inicio" %}</a>
        {% if organization|has_module:"work_orders" %}<a href="{% url 'work_order_list' %}" {% nav_current '/work-orders/' %}>{% translate "Órdenes de trabajo" %}</a>{% endif %}
        {% if organization|has_module:"assets" %}<a href="{% url 'asset_list' %}" {% nav_current '/assets/' %}>{% translate "Activos" %}</a>{% endif %}
        {% if membership|can_view:"work_order.manage" and organization|has_module:"requests" %}<a href="{% url 'request_list' %}" {% nav_current '/requests/' %}>{% translate "Solicitudes" %}</a>{% endif %}
        {% if membership|can:"inventory.view" and organization|has_module:"inventory" %}<a href="{% url 'inventory_home' %}" {% nav_current '/inventory/' %}>{% translate "Inventario" %}</a>{% endif %}
        {# Catálogo de falla, ubicaciones, clases, equipo, auditoría y configuración viven en "Más", igual que en móvil. #}
        <a href="{% url 'menu' %}" {% nav_current '/menu/' '/report/' '/failure-codes/' '/team/' '/audit/' '/locations/' '/asset-classes/' '/settings/' '/plans/' '/reports/' '/condition/' '/assistant/' %}>{% translate "Más" %}</a>
      </nav>
      <div class="navbar__right">
        {% if memberships|length > 1 %}
        <form method="post" action="{% url 'switch_organization' %}" class="org-switch" data-field-switch>
          {% csrf_token %}
          <label class="visually-hidden" for="org-select">{% translate "Organización" %}</label>
          <select id="org-select" name="organization">
            {% for m in memberships %}
            <option value="{{ m.organization_id }}" {% if m.organization_id == organization.id %}selected{% endif %}>{{ m.organization.short_name }}</option>
            {% endfor %}
          </select>
          <button class="btn-nav" type="submit">{% translate "Cambiar" %}</button>
        </form>
        {% elif organization %}
        <span class="navbar__org">{{ organization.short_name }}</span>
        {% endif %}
        {% if membership %}
        {# Campana (X-02): el contador llega por htmx al cargar y cada 60 s; la página no espera la consulta. #}
        <a class="navbar__bell" href="{% url 'notification_list' %}" {% nav_current '/notifications/' %}>{% icon 'bell' %}<span class="visually-hidden">{% translate "Notificaciones" %}</span><span class="navbar__bell-count" hx-get="{% url 'notification_badge' %}" hx-trigger="load, every 60s"></span></a>
        {% endif %}
        {# Solo el nombre: el rol, el correo y "Cambiar contraseña" están en "Mi cuenta" de /menu/. #}
        <a class="navbar__user" href="{% url 'menu' %}#account"><span class="visually-hidden">{% translate "Mi cuenta" %}: </span>{{ user.short_name }}</a>
        {% include "_theme_button.html" %}
        <form method="post" action="{% url 'account_logout' %}" data-field-exit>
          {% csrf_token %}
          <button class="btn-nav" type="submit">{% icon 'logout' %}{% translate "Salir" %}</button>
        </form>
      </div>
    </div>
  </header>
  {% endif %}

  <main id="main">
    {% include "_messages.html" %}
    {% if organization.status == "pending_deletion" %}{% include "organizations/_deletion_banner.html" %}{% endif %}
    {% if billing_status.needs_attention %}{% include "billing/_banner.html" %}{% endif %}
    {% block content %}{% endblock %}
    <p class="footer">GALBUST CMMS · {% translate "con tecnología de" %} GALBUST{% if user.is_staff %} · <a href="{% url 'design_system' %}">{% translate "Sistema de diseño" %}</a>{% endif %}</p>
  </main>

  {% include "_field_exit_dialog.html" %}
  {% if user.is_authenticated %}
  <nav class="bottom-nav" aria-label="{% translate 'Navegación móvil' %}">
    <a href="{% url 'dashboard' %}" {% nav_current '/' %}>{% icon 'home' %}{% translate "Inicio" %}</a>
    {% if organization|has_module:"work_orders" %}<a href="{% url 'work_order_list' %}?scope=mine" {% nav_current '/work-orders/' %}>{% icon 'list' %}{% translate "Mis OT" %}</a>{% endif %}
    {% if organization|has_module:"assets" %}<a href="{% url 'asset_list' %}" {% nav_current '/assets/' %}>{% icon 'box' %}{% translate "Activos" %}</a>{% endif %}
    <a href="{% url 'menu' %}" {% nav_current '/menu/' '/report/' '/requests/' '/failure-codes/' '/team/' '/audit/' '/locations/' '/asset-classes/' '/settings/' '/plans/' '/reports/' '/condition/' '/inventory/' '/assistant/' %}>{% icon 'menu' %}{% translate "Más" %}</a>
  </nav>
  {% endif %}
</body>
</html>
