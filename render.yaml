# Blueprint de Render: ambiente de DEMOSTRACIÓN de GALBUST CMMS en el plan gratuito.
# Render → New → Blueprint → este repositorio. Ver docs/operacion/render.md.
#
# Limitaciones del plan gratis (aceptables para mostrar a prospectos):
# - El servidor se duerme tras 15 min sin visitas (la primera visita tarda ~1 min).
# - La base gratuita vence a los 30 días: se vuelve a crear y seed_demo recarga los datos.
# - Sin disco: las fotos subidas se pierden al dormir o redesplegar.
# - Sin cron ni preDeployCommand: migraciones, datos demo y preventivos corren al arrancar.
# Para un piloto con datos reales se pasa a planes pagados (ver la guía).

databases:
  - name: cmms-db
    plan: free
    region: ohio
    postgresMajorVersion: "16"
    databaseName: cmms
    user: cmms

services:
  - type: web
    name: galbust-cmms
    runtime: python
    plan: free
    region: ohio
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Cada arranque (también al despertar): migra, carga la demo si no existe
    # y genera los preventivos del día (reemplaza al cron del plan pagado).
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py seed_demo &&
      python manage.py generate_preventive_work_orders &&
      gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: cmms-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Render pone un proxy delante y agrega la IP real del cliente al final de
      # X-Forwarded-For: la auditoría toma ese último valor (X-01).
      - key: AUDIT_TRUSTED_PROXIES
        value: "1"
      # Sin proveedor de correo aún: se pide verificar pero no se bloquea el acceso.
      # Al configurar SMTP (EMAIL_BACKEND, EMAIL_HOST…) se quita y queda obligatoria.
      - key: ACCOUNT_EMAIL_VERIFICATION
        value: optional
      - key: DEMO_PASSWORD
        sync: false # Render la pide al crear el Blueprint; no queda en el repo.
