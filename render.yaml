# Blueprint de Render: ambiente de DEMOSTRACIÓN de GALBUST CMMS.
# Render → New → Blueprint → este repositorio. Ver docs/operacion/render.md.
#
# Web en Starter (2026-10-21): el plan gratis bloquea el SMTP saliente y ningún
# correo salía; Starter además no se duerme.
#
# Base en Neon (2026-10-30, docs/07_operacion.md §2b), no en Render: la base gratis
# de Render vencía a los 30 días. DATABASE_URL va solo en el panel (sync: false).
# No volver a declarar una base aquí con fromDatabase: cada cambio de este archivo
# sincroniza el Blueprint y esa referencia pisa la URL de Neon (pasó con 8b3229b).
#
# Limitaciones que quedan (aceptables para la primera versión):
# - Fotos y archivos en R2; sin worker: las tareas diarias corren en GitHub Actions.
# - Sin preDeployCommand: migraciones, datos demo y preventivos corren al arrancar.
# Producción con worker y base pagada: render.production.example.yaml.

services:
  - type: web
    name: galbust-cmms
    runtime: python
    plan: starter
    region: ohio
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Cada arranque (también al despertar): migra, carga la demo si no existe
    # y genera los preventivos del día (reemplaza al cron del plan pagado).
    # --reset-if-stale: si la demo se cargó antes de inventario, condición o el
    # asistente, se recrea completa una vez (se pierde lo creado a mano en la demo).
    # Sin ANTHROPIC_API_KEY ni worker: el asistente muestra las conversaciones de
    # ejemplo y "Pedir ayuda" avisa que no está configurado (D3).
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py seed_demo --reset-if-stale &&
      python manage.py generate_preventive_work_orders &&
      gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: DJANGO_DEBUG
        value: "0"
      # URL directa de Neon (sin -pooler): RLS por conexión y pg_dump lo necesitan.
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Dominio propio (Cloudflare → Render); Render agrega solo galbust-cmms.onrender.com.
      - key: DJANGO_ALLOWED_HOSTS
        value: app.galbust.com
      - key: SITE_URL
        value: https://app.galbust.com
      # app.galbust.com pasa por el proxy de Cloudflare (2026-10-31) y luego por el
      # de Render: cada uno agrega a X-Forwarded-For la IP que se le conectó, así que
      # el cliente es el penúltimo valor (X-01; docs/07_operacion.md §1). Con "1" la
      # auditoría y el límite de intentos de login verían IPs de Cloudflare.
      - key: AUDIT_TRUSTED_PROXIES
        value: "2"
      # Correo (docs/07_operacion.md): sin EMAIL_HOST los correos solo van al log
      # y no llega ninguno (verificación, invitaciones, claves, notificaciones).
      # Buzón del hosting (cPanel): SSL directo en el puerto 465. La clave del
      # buzón va solo en el panel de Render.
      - key: EMAIL_HOST
        value: mail.galbust.com
      - key: EMAIL_USE_SSL
        value: "1"
      - key: EMAIL_HOST_USER
        value: no-reply@galbust.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: GALBUST CMMS <no-reply@galbust.com>
      - key: BILLING_CONTACT_EMAIL
        value: ventas@galbust.com
      # Sin proveedor de correo aún: se pide verificar pero no se bloquea el acceso.
      # Al configurar SMTP se quita y queda obligatoria.
      - key: ACCOUNT_EMAIL_VERIFICATION
        value: optional
      - key: DEMO_PASSWORD
        sync: false # Render la pide al crear el Blueprint; no queda en el repo.
